<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register — salaksak.art.net</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 text-stone-800 antialiased min-h-screen">

    <header class="bg-white border-b border-orange-100">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-tight bg-gradient-to-r from-rose-600 to-orange-600 bg-clip-text text-transparent">
                🎨 salaksak<span class="text-stone-900 font-medium">.art.net</span>
            </a>
            <a href="index.html" class="text-sm font-bold text-stone-600 hover:text-rose-600">← Back to gallery</a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12">
        <div class="bg-white rounded-3xl border border-orange-100 shadow-xl overflow-hidden">

            <!-- Already signed in notice -->
            <div id="signed-in-note" class="hidden bg-amber-50 border-b border-orange-100 px-6 py-4 text-sm">
                <p>You're signed in as <b id="signed-in-name"></b>.</p>
                <div class="mt-2 flex gap-3 text-xs font-bold">
                    <a id="continue-link" href="index.html" class="text-rose-600 hover:underline">Continue →</a>
                    <button type="button" id="switch-btn" class="text-stone-500 hover:underline">Sign out to switch account</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="grid grid-cols-3 text-xs font-extrabold border-b border-orange-100">
                <button type="button" data-tab="login" class="tab-btn py-4 text-rose-600 border-b-2 border-rose-600">Sign in</button>
                <button type="button" data-tab="register" class="tab-btn py-4 text-stone-500 border-b-2 border-transparent">Register</button>
                <button type="button" data-tab="apply" class="tab-btn py-4 text-stone-500 border-b-2 border-transparent">Become an Artist</button>
            </div>

            <div class="p-8">
                <!-- SIGN IN -->
                <form id="login-form" class="space-y-4 tab-panel" data-panel="login">
                    <h1 class="text-2xl font-black tracking-tight">Welcome back 👋</h1>
                    <input id="login-email" type="email" required placeholder="Email" autocomplete="email"
                           class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <input id="login-password" type="password" required placeholder="Password" autocomplete="current-password"
                           class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <button type="submit" class="w-full bg-gradient-to-r from-rose-600 to-orange-600 text-white font-black py-3 rounded-xl shadow-md disabled:opacity-50">Sign in</button>
                </form>

                <!-- REGISTER -->
                <form id="register-form" class="space-y-4 tab-panel hidden" data-panel="register">
                    <h1 class="text-2xl font-black tracking-tight">Create your account 🎨</h1>
                    <input id="reg-name" required placeholder="Full name" autocomplete="name"
                           class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <input id="reg-email" type="email" required placeholder="Email" autocomplete="email"
                           class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <input id="reg-password" type="password" required minlength="6" placeholder="Password (min. 6 characters)" autocomplete="new-password"
                           class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <button type="submit" class="w-full bg-stone-900 text-white font-black py-3 rounded-xl shadow-md disabled:opacity-50">Create account</button>
                </form>

                <!-- APPLY AS ARTIST -->
                <form id="apply-form" class="space-y-4 tab-panel hidden" data-panel="apply">
                    <h1 class="text-2xl font-black tracking-tight">Apply as an Artist ✨</h1>
                    <p class="text-xs text-stone-500">An admin reviews every application. Upload a sample of your work so we can verify it.</p>
                    <div id="apply-account-fields" class="space-y-4">
                        <input id="apply-name" placeholder="Full name" autocomplete="name"
                               class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                        <input id="apply-email" type="email" placeholder="Email" autocomplete="email"
                               class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                        <input id="apply-password" type="password" minlength="6" placeholder="Password" autocomplete="new-password"
                               class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    </div>
                    <input id="apply-store" required placeholder="Studio / store name"
                           class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <label class="block text-xs font-semibold text-stone-600">Portfolio sample (image)
                        <input id="apply-file" type="file" accept="image/*"
                               class="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2">
                    </label>
                    <button type="submit" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-black py-3 rounded-xl shadow-md disabled:opacity-50">Submit application</button>
                </form>

                <p id="msg" class="mt-4 text-sm font-semibold text-rose-600"></p>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const rawNext = params.get('next') || '';
        // Only allow redirects to a plain page in this site, e.g. "checkout.html"
        const safeNext = /^[a-zA-Z0-9_-]+\.html$/.test(rawNext) ? rawNext : '';
        let loggedIn = false;

        const msg = document.getElementById('msg');

        function showTab(name) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
            document.querySelectorAll('.tab-btn').forEach(b => {
                const on = b.dataset.tab === name;
                b.className = 'tab-btn py-4 border-b-2 ' + (on ? 'text-rose-600 border-rose-600' : 'text-stone-500 border-transparent');
            });
            msg.textContent = '';
        }
        document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

        function go(redirect) {
            // Admins/sellers/pending users go where the server says; buyers can go back to "next".
            if ((redirect === 'index.html' || redirect === 'dashboard.html') && safeNext) location.href = safeNext;
            else location.href = redirect || 'index.html';
        }

        async function postJson(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || data.success === false) throw new Error(data.error || 'Something went wrong.');
            return data;
        }

        async function guarded(btn, fn) {
            msg.textContent = '';
            btn.disabled = true;
            try { await fn(); }
            catch (err) { msg.textContent = err.message; btn.disabled = false; }
        }

        document.getElementById('login-form').addEventListener('submit', e => {
            e.preventDefault();
            guarded(e.target.querySelector('button[type=submit]'), async () => {
                const data = await postJson('/api/login', {
                    email: document.getElementById('login-email').value.trim(),
                    password: document.getElementById('login-password').value
                });
                go(data.redirect);
            });
        });

        document.getElementById('register-form').addEventListener('submit', e => {
            e.preventDefault();
            guarded(e.target.querySelector('button[type=submit]'), async () => {
                const data = await postJson('/api/register', {
                    name: document.getElementById('reg-name').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    password: document.getElementById('reg-password').value
                });
                go(data.redirect);
            });
        });

        document.getElementById('apply-form').addEventListener('submit', e => {
            e.preventDefault();
            guarded(e.target.querySelector('button[type=submit]'), async () => {
                const fd = new FormData();
                fd.append('store_name', document.getElementById('apply-store').value.trim());
                if (!loggedIn) {
                    const name = document.getElementById('apply-name').value.trim();
                    const email = document.getElementById('apply-email').value.trim();
                    const password = document.getElementById('apply-password').value;
                    if (!name || !email || !password) throw new Error('Name, email and password are required.');
                    fd.append('name', name);
                    fd.append('email', email);
                    fd.append('password', password);
                }
                const file = document.getElementById('apply-file').files[0];
                if (file) fd.append('portfolio', file);

                const res = await fetch('/api/apply-seller', { method: 'POST', body: fd, credentials: 'same-origin' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.success === false) throw new Error(data.error || 'Application failed.');
                location.href = data.redirect || 'pending.html';
            });
        });

        // If already signed in: show a note, and hide account fields on the artist form.
        (async function init() {
            if (params.get('tab')) showTab(params.get('tab'));
            try {
                const s = await (await fetch('/api/session', { credentials: 'same-origin' })).json();
                if (!s.loggedIn) return;
                loggedIn = true;
                document.getElementById('signed-in-note').classList.remove('hidden');
                document.getElementById('signed-in-name').textContent = s.name;
                document.getElementById('continue-link').href =
                    (s.role === 'admin' || s.role === 'seller') ? 'dashboard.html' :
                    (s.status === 'pending' ? 'pending.html' : 'index.html');
                document.getElementById('apply-account-fields').classList.add('hidden');
            } catch (e) { /* not signed in */ }
        })();

        document.getElementById('switch-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
            location.reload();
        });
    </script>
</body>
</html>
