<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Application — salaksak.art.net</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 text-stone-800 antialiased min-h-screen">

    <header class="bg-white border-b border-orange-100">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-tight bg-gradient-to-r from-rose-600 to-orange-600 bg-clip-text text-transparent">
                🎨 salaksak<span class="text-stone-900 font-medium">.art.net</span>
            </a>
            <button id="logout-btn" type="button" class="text-sm font-bold text-stone-600 hover:text-rose-600">Logout</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 py-14">
        <div id="card" class="bg-white rounded-3xl border border-orange-100 shadow-xl p-8 text-center">
            <p class="text-stone-400 text-sm">Checking your application...</p>
        </div>
    </main>

    <script>
        let timer = null;
        const card = document.getElementById('card');

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function render(s) {
            if (s.role === 'admin' || (s.role === 'seller' && s.status === 'approved')) {
                card.innerHTML = `
                    <div class="text-6xl mb-3">🎉</div>
                    <h1 class="text-2xl font-black">You're approved, ${esc(s.name)}!</h1>
                    <p class="text-stone-500 mt-2 text-sm">Your artist studio is ready. You can now publish artworks, receive orders and message buyers.</p>
                    <a href="dashboard.html" class="inline-block mt-6 bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-black px-8 py-3 rounded-xl shadow-md">Open Artist Studio</a>`;
                fetch('/api/mark-approval-seen', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
                clearInterval(timer);
                return;
            }

            if (s.status === 'pending') {
                card.innerHTML = `
                    <div class="text-6xl mb-3">⏳</div>
                    <h1 class="text-2xl font-black">Application under review</h1>
                    <p class="text-stone-500 mt-2 text-sm">Thanks, ${esc(s.name)}! An admin is reviewing your artist application. This page updates automatically once a decision is made.</p>
                    <a href="index.html" class="inline-block mt-6 border border-stone-300 font-bold px-6 py-2.5 rounded-xl text-sm hover:border-rose-300">Browse the gallery meanwhile</a>`;
                return;
            }

            const rejected = s.status === 'rejected';
            card.innerHTML = `
                <div class="text-5xl mb-3">${rejected ? '📝' : '🎨'}</div>
                <h1 class="text-2xl font-black">${rejected ? 'Application not approved' : 'Become a verified artist'}</h1>
                <p class="text-stone-500 mt-2 text-sm">${rejected
                    ? 'Your last application was not approved. You can update your details and apply again.'
                    : 'Sell your original artworks to collectors worldwide. Tell us about your studio.'}</p>
                <form id="apply-form" class="mt-6 space-y-3 text-left">
                    <input id="store" required placeholder="Studio / store name" class="w-full border border-stone-300 rounded-xl px-4 py-3 text-sm">
                    <label class="block text-xs font-semibold text-stone-600">Portfolio sample (image)
                        <input id="file" type="file" accept="image/*" class="mt-1 w-full border border-stone-300 rounded-xl px-3 py-2">
                    </label>
                    <button class="w-full bg-gradient-to-r from-rose-600 to-orange-600 text-white font-black py-3 rounded-xl shadow-md disabled:opacity-50">Submit application</button>
                    <p id="msg" class="text-sm font-semibold text-rose-600"></p>
                </form>`;
            clearInterval(timer);

            document.getElementById('apply-form').addEventListener('submit', async e => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const msg = document.getElementById('msg');
                msg.textContent = '';
                btn.disabled = true;

                const fd = new FormData();
                fd.append('store_name', document.getElementById('store').value.trim());
                const f = document.getElementById('file').files[0];
                if (f) fd.append('portfolio', f);

                try {
                    const res = await fetch('/api/apply-seller', { method: 'POST', body: fd, credentials: 'same-origin' });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || data.success === false) throw new Error(data.error || 'Application failed.');
                    load();
                    timer = setInterval(load, 10000);
                } catch (err) {
                    msg.textContent = err.message;
                    btn.disabled = false;
                }
            });
        }

        async function load() {
            try {
                const res = await fetch('/api/session', { credentials: 'same-origin' });
                const ct = res.headers.get('content-type') || '';
                if (!res.ok || !ct.includes('application/json')) {
                    throw new Error('The server did not return JSON (status ' + res.status + ').');
                }
                const s = await res.json();
                if (!s.loggedIn) { location.href = 'login.html?next=pending.html'; return; }
                render(s);
            } catch (e) {
                card.innerHTML = `
                    <div class="text-5xl mb-3">⚠️</div>
                    <h1 class="text-xl font-black">Could not load your application</h1>
                    <p class="text-rose-600 text-sm mt-2">${esc(e.message)}</p>
                    <p class="text-stone-500 text-xs mt-3 leading-relaxed">
                        Make sure <b>node server.js</b> is running and that you opened this page from
                        <b>http://localhost:3000/pending.html</b> (not Live Server or a file).
                    </p>
                    <button onclick="load()" class="mt-5 border border-stone-300 font-bold px-5 py-2 rounded-xl text-sm">Try again</button>`;
            }
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
            location.href = 'index.html';
        });

        load();
        timer = setInterval(load, 10000);
    </script>
</body>
</html>
